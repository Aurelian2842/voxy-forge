tasks.register("embedNatives", Copy) {
    from(configurations.runtimeClasspath) {
        include("**/lwjgl-lmdb-*natives*.jar")
        include("**/lwjgl-zstd-*natives*.jar")
    }
    into("$buildDir/libs/natives")
}

tasks.register("patchJarJarManifest") {
    dependsOn tasks.named('jarJar')

    doLast {
        def jarFile = tasks.named('jarJar').get().outputs.files.singleFile

        def fs = java.nio.file.FileSystems.newFileSystem(jarFile.toPath(), (ClassLoader) null)
        try {
            def metadataPath = fs.getPath("META-INF/jarjar/metadata.json")
            def slurper = new groovy.json.JsonSlurper()
            def metadata = slurper.parse(Files.readAllBytes(metadataPath), "UTF-8")
            def nativesDir = file("$buildDir/libs/natives")
            nativesDir.listFiles()?.findAll { it.name.endsWith(".jar") }?.each { nativeJar ->
                def matcher = (nativeJar.name =~ /^(.+)-(\d+\.\d+[\.\d]*)-natives(.*)\.jar$/)
                if (matcher.matches()) {
                    def artifactId = matcher[0][1]
                    def version    = matcher[0][2]
                    def classifier = matcher[0][3]

                    def entry = [
                            identifier: [
                                    group  : "org.lwjgl",
                                    artifact: artifactId + classifier
                            ],
                            version: [
                                    range  : "[${version},)",
                                    artifactVersion: version
                            ],
                            path: "META-INF/jarjar/${nativeJar.name}",
                            isObfuscated: false
                    ]
                    metadata.jars << entry
                }
            }
            def json = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(metadata)
            )
            Files.write(metadataPath, json.getBytes("UTF-8"))
        } finally {
            fs.close()
        }
    }
}

tasks.named('jarJar') {
    dependsOn tasks.named('embedNatives')
    from("$buildDir/libs/natives") {
        into 'META-INF/jarjar'
    }
    finalizedBy tasks.named('patchJarJarManifest')
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing() {
    publications() {
        mavenJava(MavenPublication) {
            from(components.java)
        }
    }

    repositories() {
        mavenLocal()
    }
}